<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Orb ASR/TTS Option 3</title>
<style>
  body { margin:0; height:100vh; display:flex; align-items:center; justify-content:center; background:#0b0f1a; }
  .orb {
    width:68px; height:68px;
    border-radius:50%;
    background: radial-gradient(circle at 30% 30%, #8b5cf6, #6d28d9);
    position:relative;
    overflow:hidden;
  }
  .orb::before {
    content:"";
    position:absolute; inset:0;
    border-radius:50%;
    border:2px solid rgba(255,255,255,.2);
    pointer-events:none;
  }
  .icons {
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    width:24px; height:24px;
    display:flex; justify-content:space-between;
  }
  .mic, .speaker {
    width:10px; height:10px;
  }
  .mic { background:url('data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22><path fill=%22%23fff%22 d=%22M9 3v11a7 7 0 0 0 14 0V3H9zM12 18v3%22/></svg>') no-repeat center; }
  .speaker { background:url('data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22><path fill=%22%23fff%22 d=%22M12 4a2 2 0 0 1 2 2v1.5a1 1 0 0 0 1 1H15a3 3 0 0 1 3 3v4a3 3 0 0 1-3 3H8a1 1 0 0 0-1 1v1.5a1 1 0 0 0 1 1h3a2 2 0 0 1 2 2V4h4zM12 14a2 2 0 1 0 0-4 2 2 0 0 0 0 4z%22/></svg>') no-repeat center; }
</style>
</head>
<body>
<div class="orb">
  <div class="icons">
    <div class="mic"></div>
    <div class speaker></div>
  </div>
</div>
</body>
</html>
