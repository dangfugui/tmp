<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Orb ASR/TTS Option 2</title>
<style>
  body { margin:0; height:100vh; display:flex; align-items:center; justify-content:center; background:#0b0f1a; }
  .orb {
    width:68px; height:68px;
    border-radius:50%;
    background: #1e293b;
    position:relative;
    overflow:hidden;
  }
  .wave {
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    width:30px; height:30px;
  }
  .wave line {
    stroke:#fff;
    stroke-width:2;
    fill:none;
  }
</style>
</head>
<body>
<div class="orb">
  <svg class="wave" viewBox="0 0 24 24">
    <!-- left side mic shape -->
    <path d="M9 3v11a7 7 0 0 0 14 0V3" stroke="#fff" stroke-width="2" fill="none"/>
    <!-- right side speaker arcs -->
    <path d="M12 4a2 2 0 0 1 2 2v1.5a1 1 0 0 0 1 1H15a3 3 0 0 1 3 3v4a3 3 0 0 1-3 3H8a1 1 0 0 0-1 1v1.5a1 1 0 0 0 1 1h3a2 2 0 0 1 2 2V4" stroke="#fff" stroke-width="2" fill="none"/>
  </svg>
</div>
</body>
</html>
