<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>悬浮球四态动画演示</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      background: #0b0f1a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #e8ecf5;
      overflow: hidden;
    }
    h1 { font-size: 22px; font-weight: 600; margin-bottom: 6px; letter-spacing: 1px; }
    .sub { font-size: 12px; color: #8b93a7; margin-bottom: 28px; }
    .grid { display: grid; grid-template-columns: repeat(2, 220px); grid-template-rows: repeat(2, 220px); gap: 24px; }
    .cell {
      background: #131a2b;
      border-radius: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border: 1px solid #232d423;
      position: relative;
      overflow: hidden;
    }
    .cell .label { position: absolute; top: 12px; left: 0; right: 0; text-align: center; font-size: 13px; color: #aeb6c8; letter-spacing: 2px; }
    .cell .desc { position: absolute; bottom: 10px; left: 0; right: 0; text-align: center; font-size: 10px; color: #5f6a82; letter-spacing: 1px; }

    /* ===== 通用球体 ===== */
    .orb {
      position: relative;
      width: 96px;
      height: 96px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .orb .core {
      position: absolute; inset: 0; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
    }
    .orb .icon { width: 34px; height: 34px; position: relative; z-index: 3; }

    /* ===== 状态1：ASR 语音识别中 ===== */
    .orb-asr .core {
      background: radial-gradient(circle at 35% 30%, #5eead4, #14b8a6 45%, #0f766e 100%);
      box-shadow: 0 0 24px rgba(45, 212, 191, 0.55), inset 0 -4px 10px rgba(0,0,0,0.25);
    }
    .orb-asr .ring {
      position: absolute; inset: -6px; border-radius: 50%;
      border: 3px solid rgba(45, 212, 191, 0.85);
      opacity: 0;
      animation: asrPing 1.6s cubic-bezier(0, 0.6, 0.4, 1) infinite;
    }
    .orb-asr .ring.r2 { animation-delay: 0.8s; }
    @keyframes asrPing {
      0% { transform: scale(0.9); opacity: 0.9; }
      100% { transform: scale(1.9); opacity: 0; }
    }
    .orb-asr .wave { position: absolute; width: 100%; height: 100%; top: 0; left: 0; display: flex; align-items: center; justify-content: center; gap: 3px; z-index: 2; }
    .orb-asr .wave i {
      width: 3px; border-radius: 2px; background: rgba(255,255,255,0.9);
      animation: asrWave 1s ease-in-out infinite;
    }
    .orb-asr .wave i:nth-child(1) { height: 8px; animation-delay: 0s; }
    .orb-asr .wave i:nth-child(2) { height: 16px; animation-delay: 0.12s; }
    .orb-asr .wave i:nth-child(3) { height: 24px; animation-delay: 0.24s; }
    .orb-asr .wave i:nth-child(4) { height: 16px; animation-delay: 0.36s; }
    .orb-asr .wave i:nth-child(5) { height: 8px; animation-delay: 0.48s; }
    @keyframes asrWave {
      0%, 100% { transform: scaleY(0.4); opacity: 0.5; }
      50% { transform: scaleY(1); opacity: 1; }
    }

    /* ===== 状态2：TTS 语音播报中 ===== */
    .orb-tts .core {
      background: radial-gradient(circle at 35% 30%, #fda4af, #f43f5e 45%, #be123c 100%);
      box-shadow: 0 0 24px rgba(244, 63, 94, 0.55), inset 0 -4px 10px rgba(0,0,0,0.25);
      animation: ttsPulse 1.4s ease-in-out infinite;
    }
    @keyframes ttsPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.07); }
    }
    .orb-tts .note { position: absolute; width: 100%; height: 100%; z-index: 2; }
    .orb-tts .note i {
      position: absolute; width: 4px; height: 4px; border-radius: 50%;
      background: rgba(255, 180, 190, 0.9); opacity: 0;
      animation: ttsNote 1.4s ease-out infinite;
    }
    .orb-tts .note i:nth-child(1) { top: 18%; left: 30%; animation-delay: 0s; }
    .orb-tts .note i:nth-child(2) { top: 10%; left: 52%; animation-delay: 0.3s; }
    .orb-tts .note i:nth-child(3) { top: 22%; right: 26%; animation-delay: 0.6s; }
    .orb-tts .note i:nth-child(4) { top: 34%; right: 14%; animation-delay: 0.9s; }
    @keyframes ttsNote {
      0% { transform: translateY(0) scale(0.5); opacity: 0; }
      25% { opacity: 1; }
      100% { transform: translateY(-26px) scale(1.4); opacity: 0; }
    }

    /* ===== 状态3：聊天页面 ===== */
    .orb-chat .core {
      background: radial-gradient(circle at 35% 30%, #93c5fd, #3b82f6 45%, #1d4ed8 100%);
      box-shadow: 0 0 24px rgba(59, 130, 246, 0.55), inset 0 -4px 10px rgba(0,0,0,0.25);
    }
    .orb-chat .bubble {
      position: absolute; width: 40px; height: 30px; border-radius: 14px;
      background: rgba(255,255,255,0.95);
      animation: chatBob 2.2s ease-in-out infinite;
      z-index: 2;
    }
    .orb-chat .bubble::after {
      content: ""; position: absolute; bottom: -5px; left: 8px;
      border: 6px solid transparent; border-top-color: rgba(255,255,255,0.95); border-left: 0;
    }
    @keyframes chatBob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }

    /* ===== 状态4：设置页面 ===== */
    .orb-settings .core {
      background: radial-gradient(circle at 35% 30%, #c4b5fd, #8b5cf6 45%, #6d28d9 100%);
      box-shadow: 0 0 24px rgba(139, 92, 246, 0.55), inset 0 -4px 10px rgba(0,0,0,0.25);
    }
    .orb-settings .gear {
      position: absolute; width: 40px; height: 40px; z-index: 2;
      animation: gearSpin 4s linear infinite;
    }
    @keyframes gearSpin { to { transform: rotate(360deg); } }
    .orb-settings .dot {
      position: absolute; width: 6px; height: 6px; border-radius: 50%;
      background: #fbbf24; animation: gearDot 2s ease-in-out infinite;
    }
    .orb-settings .dot.d1 { top: 14%; left: 20%; }
    .orb-settings .dot.d2 { top: 30%; right: 16%; animation-delay: 0.5s; }
    .orb-settings .dot.d3 { bottom: 20%; left: 34%; animation-delay: 1s; }
    @keyframes gearDot { 0%, 100% { opacity: 0.3; transform: scale(0.8); } 50% { opacity: 1; transform: scale(1.3); } }

    .legend { margin-top: 30px; font-size: 11px; color: #6b7488; letter-spacing: 1px; }
  </style>
</head>
<body>
  <h1>悬浮球 · 四态动画</h1>
  <div class="sub">录屏区域：每个格子 220×220，动画循环播放，可直接截取 GIF</div>

  <div class="grid">
    <!-- 状态 1：ASR 语音识别中 -->
    <div class="cell">
      <div class="label">ASR 识别中</div>
      <div class="orb orb-asr">
        <div class="core">
          <div class="wave"><i></i><i></i><i></i><i></i><i></i></div>
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="#064e3b" stroke-width="2" stroke-linecap="round">
            <rect x="9" y="3" width="6" height="11" rx="3"/>
            <path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>
          </svg>
        </div>
        <div class="ring"></div><div class="ring r2"></div>
      </div>
      <div class="desc">声波扩散 · 青绿色</div>
    </div>

    <!-- 状态 2：TTS 语音播报中 -->
    <div class="cell">
      <div class="label">TTS 播报中</div>
      <div class="orb orb-tts">
        <div class="core">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M11 5 6 9H3v6h3l5 4V5z"/>
            <path d="M15.5 8.5a5 5 0 0 1 0 7M18 6a8.5 8.5 0 0 1 0 12"/>
          </svg>
        </div>
        <div class="note"><i></i><i></i><i></i><i></i></div>
      </div>
      <div class="desc">音量脉冲 · 玫红色</div>
    </div>

    <!-- 状态 3：聊天页面 -->
    <div class="cell">
      <div class="label">聊天中</div>
      <div class="orb orb-chat">
        <div class="core">
          <div class="bubble"></div>
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="#1e3a8a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="position:absolute; opacity:0;">
            <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 8.5 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
          </svg>
        </div>
      </div>
      <div class="desc">气泡浮动 · 蓝色</div>
    </div>

    <!-- 状态 4：设置页面 -->
    <div class="cell">
      <div class="label">设置中</div>
      <div class="orb orb-settings">
        <div class="core">
          <svg class="gear" viewBox="0 0 24 24" fill="none" stroke="#f5f3ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3.2"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
        </div>
        <div class="dot d1"></div><div class="dot d2"></div><div class="dot d3"></div>
      </div>
      <div class="desc">齿轮旋转 · 紫色</div>
    </div>
  </div>

  <div class="legend">配色建议：ASR 青绿 / TTS 玫红 / 聊天 蓝 / 设置 紫 &nbsp;·&nbsp; 圆形外透明，仅球体可见</div>
</body>
</html>
