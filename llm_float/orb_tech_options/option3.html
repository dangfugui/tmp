<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Orb Tech Option 3</title>
<style>
  body {margin:0;height:100vh;display:flex;align-items:center;justify-content:center;background:#0b0f1a;}
  .orb {
    width:68px;height:68px;border-radius:50%;
    background:linear-gradient(135deg, #8b5cf6, #3b82f6);
    position:relative;overflow:hidden;
  }
  /* face */
  .face {
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:28px;height:20px;
  }
  .eye {
    position:absolute;width:6px;height:6px;background:#fff;border-radius:50%;
  }
  .eye.left {left:6px;top:4px;}
  .eye.right {right:6px;top:4px;}
  .mouth {
    position:absolute;left:50%;bottom:4px;
    transform:translateX(-50%);
    width:14px;height:6px;
    background:none;
    border-bottom:2px solid #fff;
    border-radius:50%;
  }
</style>
</head>
<body>
<div class="orb">
  <div class="face">
    <div class="eye left"></div>
    <div class="eye right"></div>
    <div class="mouth"></div>
  </div>
</div>
</body>
</html>
