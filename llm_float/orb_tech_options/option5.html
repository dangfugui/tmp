<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Orb Tech Option 5</title>
<style>
  body {margin:0;height:100vh;display:flex;align-items:center;justify-content:center;background:#0b0f1a;}
  .orb {
    width:68px;height:68px;border-radius:50%;
    background:radial-gradient(circle at 30% 30%, #8b5cf6, #3b82f6);
    position:relative;overflow:hidden;
  }
  /* subtle grid */
  .orb::before {
    content:"";
    position:absolute;inset:0;
    background:repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(255,255,255,.06) 2px, rgba(255,255,255,.06) 4px),
               repeating-linear-gradient(90deg, transparent, transparent 2px, rgba(255,255,255,.06) 2px, rgba(255,255,255,.06) 4px);
    opacity:.6;pointer-events:none;
  }
  /* cute robot eyes with highlight */
  .eyes {
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:24px;height:12px;display:flex;justify-content:space-between;
  }
  .eye {
    width:10px;height:10px;background:#fff;border-radius:50%;
    position:relative;
  }
  .eye::after {
    content:"";
    position:absolute;left:2px;top:2px;
    width:4px;height:4px;background:#8b5cf6;border-radius:50%;
  }
</style>
</head>
<body>
<div class="orb">
  <div class="eyes"><div class="eye"></div><div class="eye"></div></div>
</div>
</body>
</html>
