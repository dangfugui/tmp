<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Orb Tech Option 4</title>
<style>
  body {margin:0;height:100vh;display:flex;align-items:center;justify-content:center;background:#0b0f1a;}
  .orb {
    width:68px;height:68px;border-radius:50%;
    background:#0f172a;
    position:relative;overflow:hidden;
  }
  /* neon lines */
  .orb::before {
    content:"";
    position:absolute;inset:0;
    border:2px solid;
    border-image:linear-gradient(45deg, #8b5cf6, #3b82f6) 1;
    border-radius:50%;
    pointer-events:none;
  }
  /* simple robot visor */
  .visor {
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:24px;height:12px;
    background:linear-gradient(to bottom, transparent 40%, #60a5fa 40%, #60a5fa 60%, transparent 60%);
    border-radius:2px;
  }
</style>
</head>
<body>
<div class="orb">
  <div class="visor"></div>
</div>
</body>
</html>
