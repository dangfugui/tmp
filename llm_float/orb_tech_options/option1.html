<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Orb Tech Option 1</title>
<style>
  body {margin:0;height:100vh;display:flex;align-items:center;justify-content:center;background:#0b0f1a;}
  .orb {
    width:68px;height:68px;border-radius:50%;
    background:radial-gradient(circle at 30% 30%, #8b5cf6, #4f46e5);
    position:relative;overflow:hidden;
  }
  /* subtle circuit lines */
  .orb::before {
    content:"";
    position:absolute;inset:0;
    background:repeating-linear-gradient(45deg, transparent, transparent 2px, rgba(255,255,255,.08) 2px, rgba(255,255,255,.08) 4px);
    opacity:.6;pointer-events:none;
  }
  /* eyes */
  .eyes {
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:24px;height:12px;display:flex;justify-content:space-between;
  }
  .eye {
    width:8px;height:8px;background:#fff;border-radius:50%;
  }
</style>
</head>
<body>
<div class="orb">
  <div class="eyes"><div class="eye"></div><div class="eye"></div></div>
</div>
</body>
</html>
