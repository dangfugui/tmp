<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Orb Option 5</title>
<style>
  body { margin:0; height:100vh; display:flex; align-items:center; justify-content:center; background:#0b0f1a; }
  .orb {
    width:68px; height:68px;
    border-radius:50%;
    background: radial-gradient(circle at 30% 30%, #8b5cf6, #6d28d9);
    position:relative;
    overflow:hidden;
  }
  .orb::after {
    content:"";
    position:absolute; inset:0;
    background: radial-gradient(circle at 30% 30%, rgba(255,255,255,.35), transparent 70%);
    pointer-events:none;
  }
  .orb::before {
    content:"";
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    width:12px; height:12px;
    border-radius:50%;
    background: rgba(255,255,255,.6);
    pointer-events:none;
  }
</style>
</head>
<body>
<div class="orb"></div>
</body>
</html>
