<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Orb Option 4</title>
<style>
  body { margin:0; height:100vh; display:flex; align-items:center; justify-content:center; background:#0b0f1a; }
  .orb {
    width:68px; height:68px;
    border-radius:50%;
    background: #1e293b;
    position:relative;
    box-shadow: 0 4px 12px rgba(0,0,0,.5);
    overflow:hidden;
  }
  .orb::after {
    content:"";
    position:absolute; inset:2px;
    border-radius:50%;
    border:1px solid #3b82f6;
    pointer-events:none;
  }
  .orb::before {
    content:"";
    position:absolute; inset:0;
    background: radial-gradient(circle at 30% 30%, rgba(255,255,255,.15), transparent 70%);
    pointer-events:none;
  }
</style>
</head>
<body>
<div class="orb"></div>
</body>
</html>
