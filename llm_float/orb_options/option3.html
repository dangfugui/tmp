<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Orb Option 3</title>
<style>
  body { margin:0; height:100vh; display:flex; align-items:center; justify-content:center; background:#0b0f1a; }
  .orb {
    width:68px; height:68px;
    border-radius:50%;
    background: radial-gradient(circle at 30% 30%, #06b6d4, #0891b2);
    position:relative;
    box-shadow: 0 0 20px rgba(6,182,212,.6), inset 0 0 8px rgba(0,0,0,.4);
    overflow:hidden;
  }
  .orb::before {
    content:"";
    position:absolute; inset:0;
    background: repeating-radial-gradient(circle at center, transparent 0, transparent 2px, rgba(255,255,255,.08) 2px, rgba(255,255,255,.08) 4px);
    pointer-events:none;
    opacity:.6;
  }
</style>
</head>
<body>
<div class="orb"></div>
</body>
</html>
