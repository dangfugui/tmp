<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>llm_float · 悬浮球风格选型（10 组）</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 36px 30px 80px;
    background: radial-gradient(1200px 700px at 20% -10%, #1c2240 0%, #0c0f1c 55%, #080a12 100%);
    color: #eef1f8;
    font-family: "Segoe UI", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
  }
  h1 { font-size: 24px; margin: 0 0 6px; }
  .sub { color: #98a2b8; font-size: 14px; margin-bottom: 10px; }
  .sub b { color: #a5b4fc; }

  /* 选中提示条 */
  #picked {
    position: sticky;
    top: 0;
    z-index: 50;
    display: none;
    align-items: center;
    gap: 10px;
    margin: 14px 0 20px;
    padding: 12px 18px;
    border-radius: 14px;
    background: rgba(109, 124, 255, .14);
    border: 1px solid rgba(109, 124, 255, .5);
    backdrop-filter: blur(12px);
    font-size: 14px;
    color: #dde3ff;
  }
  #picked.show { display: flex; }
  #picked .tag {
    background: var(--pick-c, #6d7cff);
    color: #fff;
    font-weight: 700;
    padding: 2px 12px;
    border-radius: 999px;
    font-size: 13px;
  }

  .grid { display: flex; flex-wrap: wrap; gap: 22px; }

  /* 风格卡片 */
  .style-card {
    flex: 1 1 430px;
    max-width: 560px;
    border-radius: 18px;
    padding: 18px 18px 14px;
    background: rgba(255, 255, 255, .045);
    border: 1.5px solid rgba(255, 255, 255, .1);
    cursor: pointer;
    transition: border-color .2s, background .2s, transform .15s;
  }
  .style-card:hover { border-color: rgba(109, 124, 255, .55); background: rgba(109, 124, 255, .07); }
  .style-card.selected {
    border-color: #6d7cff;
    background: rgba(109, 124, 255, .12);
    box-shadow: 0 0 0 3px rgba(109, 124, 255, .22), 0 16px 40px rgba(0,0,0,.35);
  }
  .style-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 4px; }
  .style-no {
    font-size: 12px;
    font-weight: 700;
    color: #0c0f1c;
    background: #c7d2fe;
    border-radius: 7px;
    padding: 2px 8px;
  }
  .style-name { font-size: 15px; font-weight: 700; }
  .style-desc { font-size: 12.5px; color: #98a2b8; margin-bottom: 14px; line-height: 1.5; }

  .orb-row { display: flex; gap: 10px; flex-wrap: wrap; }
  .orb-cell { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .orb-box { width: 62px; height: 62px; }
  .orb-label { font-size: 10.5px; color: #98a2b8; letter-spacing: .02em; }

  .foot-note {
    margin-top: 40px;
    padding: 16px 20px;
    border: 1px dashed rgba(139, 92, 246, .5);
    border-radius: 14px;
    background: rgba(109, 124, 255, .06);
    font-size: 13.5px;
    color: #c4b5fd;
    line-height: 1.8;
  }
</style>

<!-- ============ 悬浮球通用基础（五态图标切换 / 通用结构） ============ -->
<style>
  .orb {
    position: relative;
    width: 100%;
    height: 100%;
    border: none;
    border-radius: 50%;
    cursor: pointer;
    display: grid;
    place-items: center;
    outline: none;
    padding: 0;
    background: #6d7cff;
    color: #fff;
    transition: transform .18s ease;
  }
  .orb:hover { transform: scale(1.07); }
  .orb:active { transform: scale(.95); }

  .orb .glass { position: absolute; inset: 0; border-radius: 50%; pointer-events: none; }

  .state-icon {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    opacity: 0;
    transform: scale(.5) rotate(-10deg);
    transition: opacity .22s ease, transform .3s cubic-bezier(.34, 1.56, .64, 1);
    pointer-events: none;
  }
  .state-icon svg { width: 24px; height: 24px; }
  .orb[data-state="idle"] .icon-idle,
  .orb[data-state="chat"] .icon-chat,
  .orb[data-state="settings"] .icon-settings,
  .orb[data-state="tts"] .icon-tts,
  .orb[data-state="asr"] .icon-asr {
    opacity: 1;
    transform: scale(1) rotate(0deg);
  }

  /* 动效层（通用结构，颜色继承 currentColor） */
  .fx { position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity .3s ease; }
  .orb[data-state="asr"] .fx-asr { opacity: 1; }
  .orb[data-state="tts"] .fx-tts { opacity: 1; }
  .fx-asr .ring {
    position: absolute; inset: -3px; border-radius: 50%;
    border: 2.5px solid currentColor; opacity: 0;
    animation: asrPing 1.7s cubic-bezier(0, .55, .4, 1) infinite;
  }
  .fx-asr .ring.r2 { animation-delay: .85s; }
  @keyframes asrPing { 0% { transform: scale(.92); opacity: .8; } 100% { transform: scale(1.5); opacity: 0; } }
  .fx-tts .note {
    position: absolute; width: 5px; height: 5px; border-radius: 50%;
    background: currentColor; opacity: 0;
    animation: ttsNote 1.6s ease-out infinite;
  }
  .fx-tts .note.n1 { top: 32%; left: 26%; }
  .fx-tts .note.n2 { top: 22%; left: 48%; animation-delay: .5s; }
  .fx-tts .note.n3 { top: 30%; right: 20%; animation-delay: 1s; }
  @keyframes ttsNote {
    0% { transform: translateY(4px) scale(.6); opacity: 0; }
    30% { opacity: 1; }
    100% { transform: translateY(-20px) scale(1.3); opacity: 0; }
  }

  /* 通用动效关键帧 */
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
  @keyframes glowPulse { 0%, 100% { opacity: .75; } 50% { opacity: 1; } }
  @keyframes bounce { 0%, 100% { transform: translateY(0); } 40% { transform: translateY(-7px); } 60% { transform: translateY(-3px); } }
</style>

  .g8 .state-icon svg { filter: drop-shadow(0 0 5px currentColor); }
  .g8 .orb[data-state="idle"] { animation: glowPulse 2.4s ease-in-out infinite; }
  .g8 .orb[data-state="chat"] .icon-chat svg { animation: bob 2.2s ease-in-out infinite; }
  .g8 .orb[data-state="settings"] .icon-settings svg { animation: spin 5s linear infinite; transform-origin: center; }
</style>

<!-- ============ G9 自然绿意 ============ -->
<style>
  .g9 .orb {
    background: linear-gradient(150deg, #84cc16 0%, #4d7c0f 60%, #365314 100%);
    color: #f0fdf4;
    box-shadow: 0 10px 22px rgba(77,124,15,.4), 0 3px 8px rgba(0,0,0,.2), inset 0 2px 3px rgba(255,255,255,.25);
  }
  .g9 .orb .glass { background: radial-gradient(circle at 32% 22%, rgba(255,255,255,.28), rgba(255,255,255,0) 50%); }
  .g9 .orb[data-state="chat"] { background: linear-gradient(150deg, #10b981 0%, #065f46 60%, #064e3b 100%); box-shadow: 0 10px 22px rgba(16,185,129,.4), 0 3px 8px rgba(0,0,0,.2), inset 0 2px 3px rgba(255,255,255,.25); }
  .g9 .orb[data-state="settings"] { background: linear-gradient(150deg, #2dd4bf 0%, #0f766e 60%, #134e4a 100%); box-shadow: 0 10px 22px rgba(45,212,191,.4), 0 3px 8px rgba(0,0,0,.2), inset 0 2px 3px rgba(255,255,255,.25); }
  .g9 .orb[data-state="tts"] { background: linear-gradient(150deg, #f59e0b 0%, #b45309 60%, #78350f 100%); box-shadow: 0 10px 22px rgba(180,83,9,.4), 0 3px 8px rgba(0,0,0,.2), inset 0 2px 3px rgba(255,255,255,.25); }
  .g9 .orb[data-state="asr"] { background: linear-gradient(150deg, #a3e635 0%, #65a30d 60%, #3f6212 100%); box-shadow: 0 10px 22px rgba(101,163,13,.4), 0 3px 8px rgba(0,0,0,.2), inset 0 2px 3px rgba(255,255,255,.25); }
  .g9 .state-icon svg { filter: drop-shadow(0 1px 3px rgba(0,0,0,.35)); }
  .g9 .orb[data-state="idle"] { animation: breathe 3.4s ease-in-out infinite; }
  .g9 .orb[data-state="chat"] .icon-chat svg { animation: bob 2.6s ease-in-out infinite; }
  .g9 .orb[data-state="settings"] .icon-settings svg { animation: spin 7s linear infinite; transform-origin: center; }
  .g9 .orb[data-state="tts"] .icon-tts svg { animation: glowPulse .9s ease-in-out infinite; }
</style>

<!-- ============ G10 黑白极简 ============ -->
<style>
  .g10 .orb {
    background: #ffffff;
    color: #111111;
    border: 2px solid #111111;
    box-shadow: 0 6px 16px rgba(0,0,0,.22);
  }
  .g10 .orb .glass { display: none; }
  .g10 .orb[data-state="chat"] { background: #111111; color: #ffffff; }
  .g10 .orb[data-state="settings"] { background: #ffffff; color: #111111; }
  .g10 .orb[data-state="tts"] { background: #111111; color: #ffffff; }
  .g10 .orb[data-state="asr"] { background: #ffffff; color: #111111; }
  .g10 .state-icon svg { width: 25px; height: 25px; stroke-width: 2.1; }
  .g10 .orb[data-state="idle"] { animation: glowPulse 3.2s ease-in-out infinite; }
  .g10 .orb[data-state="chat"] .icon-chat svg { animation: bob 2.4s ease-in-out infinite; }
  .g10 .orb[data-state="settings"] .icon-settings svg { animation: spin 6s linear infinite; transform-origin: center; }
  .g10 .orb[data-state="asr"] .icon-asr svg { animation: glowPulse 1.1s ease-in-out infinite; }
</style>
</head>
<body>

  <h1>悬浮球风格选型</h1>
  <div class="sub">共 <b>10 组</b>风格，每组展示五态：静默 / 聊天 / 设置 / 字幕 / 识别。点击卡片即可选中，选好告诉我编号即可。</div>

  <div id="picked">
    <span class="tag" id="picked-tag">—</span>
    <span id="picked-text"></span>
  </div>

  <div class="grid" id="grid"></div>

  <div class="foot-note">
    说明：以上 10 组仅做演示对比，<b>项目代码暂未改动</b>。挑中喜欢的组（比如「第 3 组」），我再把它按五态完整落地到 <code>web/</code> 目录，同时保持聊天 / 设置 / 字幕 / 识别四个窗口与选中风格配套。
  </div>

<script>
  var ICONS = {
    idle: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.6L19.5 10l-5.6 1.9L12 17.5l-1.9-5.6L4.5 10l5.6-1.4L12 3z"/><path d="M19 15.5l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8.8-2.2z"/></svg>',
    chat: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/><path d="M8.5 10.5h7M8.5 13.5h4.5"/></svg>',
    settings: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>',
    tts: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 6a9 9 0 0 1 0 12"/></svg>',
    asr: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2.5" width="6" height="11" rx="3"/><path d="M5 10.5a7 7 0 0 0 14 0M12 17.5v3.5M8.5 21h7"/></svg>'
  };
  var STATES = [
    { key: "idle", label: "静默" },
    { key: "chat", label: "聊天" },
    { key: "settings", label: "设置" },
    { key: "tts", label: "字幕" },
    { key: "asr", label: "识别" }
  ];
  var STYLES = [
    { no: 1, name: "液态玻璃", desc: "半透明渐变 + 顶部高光 + 语义色光晕，通透精致，柔和呼吸" },
    { no: 2, name: "极简扁平", desc: "纯色圆 + 白色细线图标，无阴影无渐变，干净利落" },
    { no: 3, name: "霓虹赛博", desc: "深黑底 + 霓虹描边 + 发光图标，赛博朋克夜场感" },
    { no: 4, name: "马卡龙奶油", desc: "低饱和柔彩色 + 奶油高光，可爱软萌" },
    { no: 5, name: "金属质感", desc: "银灰金属渐变 + 强高光反射，宝石色区分状态，沉稳高级" },
    { no: 6, name: "活力糖果", desc: "高饱和撞色渐变 + 白描边 + 弹跳动效，活泼醒目" },
    { no: 7, name: "莫兰迪雅致", desc: "莫兰迪灰调色系 + 细描边，低对比文艺感" },
    { no: 8, name: "复古合成波", desc: "深紫夜空 + 霓虹粉紫 + 网格纹理，Synthwave 复古" },
    { no: 9, name: "自然绿意", desc: "苔藓森林绿渐变，哑光磨砂质感，沉稳安静" },
    { no: 10, name: "黑白极简", desc: "黑白双色交替 + 粗线条图标，纯粹高对比" }
  ];

  var grid = document.getElementById("grid");
  STYLES.forEach(function (s) {
    var card = document.createElement("div");
    card.className = "style-card g" + s.no;
    card.dataset.no = s.no;
    card.dataset.name = s.name;

    var head = document.createElement("div");
    head.className = "style-head";
    var no = document.createElement("span");
    no.className = "style-no";
    no.textContent = "G" + s.no;
    var name = document.createElement("span");
    name.className = "style-name";
    name.textContent = s.name;
    head.appendChild(no);
    head.appendChild(name);

    var desc = document.createElement("div");
    desc.className = "style-desc";
    desc.textContent = s.desc;

    var row = document.createElement("div");
    row.className = "orb-row";
    STATES.forEach(function (st) {
      var cell = document.createElement("div");
      cell.className = "orb-cell";
      var box = document.createElement("div");
      box.className = "orb-box";
      box.innerHTML =
        '<button class="orb" data-state="' + st.key + '" aria-label="' + st.label + '">' +
          '<span class="glass"></span>' +
          '<span class="state-icon icon-idle">' + ICONS.idle + '</span>' +
          '<span class="state-icon icon-chat">' + ICONS.chat + '</span>' +
          '<span class="state-icon icon-settings">' + ICONS.settings + '</span>' +
          '<span class="state-icon icon-tts">' + ICONS.tts + '</span>' +
          '<span class="state-icon icon-asr">' + ICONS.asr + '</span>' +
          '<span class="fx fx-asr"><i class="ring r1"></i><i class="ring r2"></i></span>' +
          '<span class="fx fx-tts"><i class="note n1"></i><i class="note n2"></i><i class="note n3"></i></span>' +
        '</button>';
      var label = document.createElement("span");
      label.className = "orb-label";
      label.textContent = st.label;
      cell.appendChild(box);
      cell.appendChild(label);
      row.appendChild(cell);
    });

    card.appendChild(head);
    card.appendChild(desc);
    card.appendChild(row);
    card.addEventListener("click", function () { pick(s.no, s.name); });
    grid.appendChild(card);
  });

  var picked = document.getElementById("picked");
  var pickedTag = document.getElementById("picked-tag");
  var pickedText = document.getElementById("picked-text");

  function pick(no, name) {
    document.querySelectorAll(".style-card").forEach(function (c) {
      c.classList.toggle("selected", Number(c.dataset.no) === no);
    });
    pickedTag.textContent = "G" + no;
    pickedTag.style.setProperty("--pick-c", "var(--pick-c, #6d7cff)");
    pickedText.textContent = "已选中「" + name + "」风格 —— 告诉我编号 " + no + " 即可，我再把它完整落地到项目。";
    picked.classList.add("show");
  }
</script>
</body>
</html>
