<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>AI</title>
  <link rel="stylesheet" href="button.css" />
</head>
<body>
  <button class="orb" id="orb" aria-label="打开 AI 助手">
    <!-- ASR 语音识别中 -->
    <span class="fx fx-asr">
      <i class="ring r1"></i><i class="ring r2"></i>
      <i class="wave w1"></i><i class="wave w2"></i><i class="wave w3"></i><i class="wave w4"></i><i class="wave w5"></i>
    </span>
    <!-- TTS 语音播报中 -->
    <span class="fx fx-tts">
      <i class="note n1"></i><i class="note n2"></i><i class="note n3"></i><i class="note n4"></i>
    </span>
    <!-- 聊天页面 -->
    <span class="fx fx-chat">
      <i class="bubble"></i>
    </span>
    <!-- 设置页面 -->
    <span class="fx fx-settings">
      <i class="gear"></i>
      <i class="dot d1"></i><i class="dot d2"></i><i class="dot d3"></i>
    </span>
    <!-- 基础图标（idle 状态） -->
    <svg class="icon icon-idle" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
    </svg>
  </button>
  <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
  <script src="bridge.js"></script>
  <script src="button.js"></script>
</body>
</html>
