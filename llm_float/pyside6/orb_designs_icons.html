<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Orb Designs with Icons</title>
<style>
body {font-family: sans-serif; margin:20px; background:#fafafa;}
.container {display:flex; flex-wrap:wrap; gap:20px; justify-content:center;}
.option {border:2px solid #ddd; padding:15px; width:220px; text-align:center; background:#fff; border-radius:8px; cursor:pointer;}
.option.selected {border-color:#49BCCF;}
.option h3 {margin-top:0; font-size:1.1em;}
.orb {width:68px; height:68px; margin:0 auto 10px; position:relative; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:28px;}
.orb .icon {position:absolute; font-size:20px;}
.orb .top   {top:-8px; left:50%; transform:translateX(-50%);}
.orb .bottom{bottom:-8px; left:50%; transform:translateX(-50%);}
.orb .left  {left:-8px; top:50%; transform:translateY(-50%);}
.orb .right {right:-8px; top:50%; transform:translateY(-50%);}
</style>
</head>
<body>
<h2>选择你喜欢的悬浮球样式（带聊天、语音识别、语音播报、设置图标）</h2>
<div class="container">
  <!-- Option 1: Four icons at edges -->
  <div class="option" data-option="1" data-bg="#49BCCF" data-fg="#fff">
    <h3>方案 1：边角四图标</h3>
    <div class="orb" style="background:#49BCCF;">
      <div class="icon top" style="color:#fff;">&#128172;</div> <!-- chat -->
      <div class="icon right" style="color:#fff;">&#128266;</div> <!-- mic -->
      <div class="icon bottom" style="color:#fff;">&#128266;</div> <!-- speaker? use same? maybe use &#127914; speaker -->
      <div class="icon left" style="color:#fff;">&#9998;</div> <!-- settings -->
    </div>
    <p>顶聊天 右语音识别 底语音播报 左设置</p>
  </div>

  <!-- Option 2: Center stacked icons -->
  <div class="option" data-option="2" data-bg="#5BC2D3" data-fg="#fff">
    <h3>方案 2：中心叠放</h3>
    <div class="orb" style="background:#5BC2D3;">
      <div style="position:relative; width:100%; height:100%; display:flex; align-items:center; justify:center;">
        <div style="position:absolute; top:0; left:50%; transform:translate(-50%,-30%); font-size:22px; color:#fff;">&#128172;</div>
        <div style="position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); font-size:22px; color:#fff;">&#128266;</div>
        <div style="position:absolute; bottom:0; left:50%; transform:translate(-50%,30%); font-size:22px; color:#fff;">&#127914;</div>
        <div style="position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); font-size:22px; color:#fff; opacity:0;">&#9998;</div> <!-- hidden? maybe use four quadrants? -->
      </div>
    </div>
    <p>中心四图标叠放（可用颜色区分）</p>
  </div>

  <!-- Option 3: Quarter circle with icons -->
  <div class="option" data-option="3" data-bg="#fff" data-fg="#49BCCF">
    <h3>方案 3：四象限图标</h3>
    <div class="orb" style="background:#fff; border:2px solid #49BCCF;">
      <div style="position:absolute; inset:0; clip-path:polygon(50% 0, 100% 50%, 50% 50%, 50% 0); background:#49BCCF22;"></div>
      <div style="position:absolute; inset:0; clip-path:polygon(100% 50%, 100% 100%, 50% 100%, 50% 50%); background:#49BCCF22;"></div>
      <div style="position:absolute; inset:0; clip-path:polygon(50% 100%, 0 100%, 0 50%, 50% 50%); background:#49BCCF22;"></div>
      <div style="position:absolute; inset:0; clip-path:polygon(0 0, 50% 0, 50% 50%, 0 50%); background:#49BCCF22;"></div>
      <div class="icon top" style="color:#49BCCF; top:8px;">&#128172;</div>
      <div class="icon right" style="color:#49BCCF; right:8px;">&#128266;</div>
      <div class="icon bottom" style="color:#49BCCF; bottom:8px;">&#127914;</div>
      <div class="icon left" style="color:#49BCCF; left:8px;">&#9998;</div>
    </div>
    <p>四象限带底色提示</p>
  </div>

  <!-- Option 4: Ring with icons -->
  <div class="option" data-option="4" data-bg="#fff" data-fg="#49BCCF">
    <h3>方案 4：环形图标</h3>
    <div class="orb" style="background:#fff; border:2px dashed #49BCCF;">
      <div class="icon top" style="color:#49BCCF; top:-12px;">&#128172;</div>
      <div class="icon right" style="color:#49BCCF; right:-12px;">&#128266;</div>
      <div class="icon bottom" style="color:#49BCCF; bottom:-12px;">&#127914;</div>
      <div class="icon left" style="color:#49BCCF; left:-12px;">&#9998;</div>
    </div>
    <p>虚线环，图标外露</p>
  </div>
</div>

<script>
document.querySelectorAll('.option').forEach(opt=>{
  opt.addEventListener('click',()=>{
    document.querySelectorAll('.option').forEach(o=>o.classList.remove('selected'));
    opt.classList.add('selected');
    alert('已选择方案 '+opt.dataset.option);
  });
});
</script>
</body>
</html>
