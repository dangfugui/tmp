<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Orb Robot Option 5</title>
<style>
  body { margin:0; height:100vh; display:flex; align-items:center; justify-content:center; background:#0b0f1a; }
  .orb {
    width:68px; height:68px;
    border-radius:50%;
    background: linear-gradient(135deg, #06b6d4, #0891b2);
    position:relative;
    overflow:hidden;
  }
  .robot {
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    width:26px; height:26px;
  }
  .robot .head {
    width:20px; height:20px;
    background:#fff;
    border-radius:4px;
    margin:0 auto 2px;
    position:relative;
  }
  .robot .head .wave {
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    width:10px; height:10px;
    border:1.5px solid #8b5cf6;
    border-radius:50%;
  }
  .robot .eyes {
    width:20px; height:4px;
    display:flex; justify-content:space-between;
    margin-top:2px;
  }
  .robot .eyes span {
    display:block; width:6px; height:4px;
    background:#fff; border-radius:2px;
  }
  .robot .base {
    width:14px; height:4px;
    background:#fff;
    border-radius:2px;
    margin:0 auto;
  }
</style>
</head>
<body>
<div class="orb">
  <div class="robot">
    <div class="head">
      <div class="wave"></div>
    </div>
    <div class="eyes"><span></span><span></span></div>
    <div class="base"></div>
  </div>
</div>
</body>
</html>
