<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Orb Robot Option 3</title>
<style>
  body { margin:0; height:100vh; display:flex; align-items:center; justify-content:center; background:#0b0f1a; }
  .orb {
    width:68px; height:68px;
    border-radius:50%;
    background: #1e293b;
    position:relative;
    overflow:hidden;
  }
  .robot {
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    width:28px; height:28px;
  }
  .robot .screen {
    width:20px; height:16px;
    background:#0f172a;
    border-radius:3px;
    margin:0 auto 2px;
    position:relative;
  }
  .robot .screen::after {
    content:"";
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    width:8px; height:4px;
    background:#60a5fa;
    border-radius:2px;
  }
  .robot .eyes {
    width:20px; height:4px;
    display:flex; justify-content:space-between;
    margin-top:2px;
  }
  .robot .eyes span {
    display:block; width:6px; height:4px;
    background:#fff; border-radius:2px;
  }
  .robot .base {
    width:12px; height:4px;
    background:#fff;
    border-radius:2px;
    margin:0 auto;
  }
</style>
</head>
<body>
<div class="orb">
  <div class="robot">
    <div class="screen"></div>
    <div class="eyes"><span></span><span></span></div>
    <div class="base"></div>
  </div>
</div>
</body>
</html>
