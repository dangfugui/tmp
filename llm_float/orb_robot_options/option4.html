<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Orb Robot Option 4</title>
<style>
  body { margin:0; height:100vh; display:flex; align-items:center; justify-content:center; background:#0b0f1a; }
  .orb {
    width:68px; height:68px;
    border-radius:50%;
    background: radial-gradient(circle at 30% 30%, #8b5cf6, #6d28d9);
    position:relative;
    overflow:hidden;
  }
  .robot {
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    width:24px; height:24px;
  }
  .robot .body {
    width:20px; height:20px;
    background:#fff;
    border-radius:50%;
    position:relative;
  }
  .robot .eye {
    position:absolute; left:6px; top:6px;
    width:4px; height:4px;
    background:#8b5cf6;
    border-radius:50%;
    animation: blink 2s infinite;
  }
  @keyframes blink {
    0%, 90% { opacity:1; }
    91%, 95% { opacity:0; }
    96%, 100% { opacity:1; }
  }
  .robot .antenna {
    position:absolute; left:50%; top:-4px;
    transform:translateX(-50%);
    width:2px; height:6px;
    background:#fff;
  }
  .robot .antenna::after {
    content:"";
    position:absolute; left:50%; bottom:100%;
    transform:translateX(-50%);
    width:6px; height:6px;
    background:#fff;
    border-radius:50%;
  }
</style>
</head>
<body>
<div class="orb">
  <div class="robot">
    <div class="body">
      <div class="eye"></div>
    </div>
    <div class="antenna"></div>
  </div>
</div>
</body>
</html>
