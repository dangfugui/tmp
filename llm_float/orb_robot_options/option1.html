<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Orb Robot Option 1</title>
<style>
  body { margin:0; height:100vh; display:flex; align-items:center; justify-content:center; background:#0b0f1a; }
  .orb {
    width:68px; height:68px;
    border-radius:50%;
    background: linear-gradient(135deg, #4f46e5, #7c3aed);
    position:relative;
    overflow:hidden;
  }
  .robot {
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    width:28px; height:28px;
  }
  .robot .head { width:20px; height:20px; background:#fff; border-radius:4px; margin:0 auto 2px; }
  .robot .eyes { width:20px; height:4px; display:flex; justify-content:space-between; }
  .robot .eyes span { display:block; width:6px; height:4px; background:#fff; border-radius:2px; }
  .robot .body { width:16px; height:12px; background:#fff; border-radius:2px; margin:0 auto; }
  .robot .feet { width:16px; height:4px; display:flex; justify-content:space-between; margin-top:2px; }
  .robot .feet span { display:block; width:4px; height:4px; background:#fff; border-radius:2px; }
</style>
</head>
<body>
<div class="orb">
  <div class="robot">
    <div class="head"></div>
    <div class="eyes"><span></span><span></span></div>
    <div class="body"></div>
    <div class="feet"><span></span><span></span></div>
  </div>
</div>
</body>
</html>
