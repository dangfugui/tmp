<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Orb Robot Option 2</title>
<style>
  body { margin:0; height:100vh; display:flex; align-items:center; justify-content:center; background:#0b0f1a; }
  .orb {
    width:68px; height:68px;
    border-radius:50%;
    background: radial-gradient(circle at 30% 30%, #06b6d4, #0891b2);
    position:relative;
    overflow:hidden;
  }
  .robot {
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    width:26px; height:26px;
  }
  .robot .gear {
    width:20px; height:20px;
    border:2px solid #fff;
    border-radius:50%;
    position:relative;
    margin:0 auto;
  }
  .robot .gear::after {
    content:"";
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    width:6px; height:6px;
    background:#fff;
    border-radius:50%;
  }
  .robot .antennas {
    width:20px; height:6px;
    display:flex; justify-content:space-between;
    margin-top:4px;
  }
  .robot .antennas span {
    display:block; width:2px; height:6px; background:#fff;
  }
</style>
</head>
<body>
<div class="orb">
  <div class="robot">
    <div class="gear"></div>
    <div class="antennas"><span></span><span></span></div>
  </div>
</div>
</body>
</html>
