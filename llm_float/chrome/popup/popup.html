<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>LLM Float</title>
  <style>
    body {
      width: 230px;
      margin: 0;
      padding: 10px;
      font-family: "Segoe UI", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
      background: #17191f;
      color: #e6e9f2;
    }
    .title {
      font-size: 13px;
      font-weight: 600;
      margin: 2px 4px 10px;
      opacity: .85;
    }
    .state {
      margin: 0 4px 8px;
      font-size: 12px;
      opacity: .75;
    }
    .btn {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      box-sizing: border-box;
      margin: 4px 0;
      padding: 9px 10px;
      border: 0;
      border-radius: 10px;
      background: rgba(255, 255, 255, .07);
      color: inherit;
      font-size: 13px;
      cursor: pointer;
      text-align: left;
    }
    .btn:hover { background: rgba(255, 255, 255, .14); }
    .btn:active { background: rgba(255, 255, 255, .20); }
    .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
    .sep {
      height: 1px;
      margin: 8px 4px;
      background: rgba(255, 255, 255, .08);
    }
  </style>
</head>
<body>
  <div class="title">LLM Float 悬浮助手</div>
  <div class="state" id="state">状态：--</div>
  <button class="btn" id="btn-toggle">
    <span class="dot" id="dot-toggle"></span><span id="label-toggle">开关本插件</span>
  </button>
  <div class="sep"></div>
  <button class="btn" id="btn-tts">
    <span class="dot" style="background:#60a5fa"></span>TTS 朗读 Demo
  </button>
  <button class="btn" id="btn-asr">
    <span class="dot" style="background:#a78bfa"></span>ASR 识别 Demo
  </button>
  <script src="popup.js"></script>
</body>
</html>
