<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>LLM Float Orb Settings</title>
<style>
  body { font-family: sans-serif; margin: 20px; }
  .setting { margin: 15px 0; }
  label { display: block; margin-bottom: 5px; }
  input[type=checkbox] { margin-right: 8px; }
  button { padding: 8px 16px; margin-top: 20px; }
</style>
</head>
<body>
<h2>LLM Float Orb Settings</h2>
<div class="setting">
  <label>
    <input type="checkbox" id="enableSound"> Enable sound feedback
  </label>
</div>
<div class="setting">
  <label>
    <input type="checkbox" id="autoStart"> Auto-start on Chrome launch
  </label>
</div>
<div class="setting">
  <label>
    Orb size (px):
    <input type="number" id="orbSize" min="40" max="120" value="68" style="width:60px;">
  </label>
</div>
<button id="save">Save Settings</button>
<script src="options.js"></script>
</body>
</html>
